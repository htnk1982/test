name: Build PST Thread Extractor v1.3

on:
  push:
    branches:
      - pst-extractor-v1.3-build
    paths:
      - 'pst-extractor-v1.3/**'
      - '.github/workflows/build-pst-extractor-v1.3.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Reconstruct and verify source bundle
        shell: pwsh
        run: |
          @'
          import base64, hashlib, pathlib, re, sys
          root = pathlib.Path('pst-extractor-v1.3/parts')
          files = [root / f'part_{i:02d}' for i in range(7)]
          parts = [re.sub(r'\s+', '', p.read_text(encoding='utf-8-sig')) for p in files]
          print('part lengths:', [len(x) for x in parts])
          expected = '033791e6bc7842b3ddb1308113a4ac8b3506466376a25dc95e71932c37e77019'
          def decode_hash(s):
              try:
                  b = base64.b64decode(s, validate=True)
              except Exception:
                  return None, None
              return b, hashlib.sha256(b).hexdigest()
          joined = ''.join(parts)
          data, h = decode_hash(joined)
          if h != expected:
              # GitHub transfer diagnostics showed only part_01 is one Base64 char longer than the local source.
              # Find that one surplus character by the immutable ZIP SHA-256 rather than guessing its position.
              p = parts[1]
              if len(p) != 7001:
                  raise SystemExit(f'unexpected part_01 length {len(p)}; direct hash={h}')
              prefix = parts[0]
              suffix = ''.join(parts[2:])
              found = None
              for i in range(len(p)):
                  candidate = prefix + p[:i] + p[i+1:] + suffix
                  b, hh = decode_hash(candidate)
                  if hh == expected:
                      found = (i, p[i], b)
                      break
              if found is None:
                  raise SystemExit(f'could not self-repair source transfer; direct hash={h}')
              i, ch, data = found
              print(f'self-repaired transfer: removed one surplus Base64 char from part_01 at offset {i}: {ch!r}')
          out = pathlib.Path('pst-extractor-v1.3/source.zip')
          out.write_bytes(data)
          final = hashlib.sha256(data).hexdigest()
          print('source zip sha256=', final)
          if final != expected:
              raise SystemExit(f'source bundle checksum mismatch: {final}')
          '@ | python -
          New-Item -ItemType Directory -Force 'pst-extractor-v1.3/src' | Out-Null
          Expand-Archive -Path 'pst-extractor-v1.3/source.zip' -DestinationPath 'pst-extractor-v1.3/src' -Force
          Get-ChildItem 'pst-extractor-v1.3/src'

      - name: Install dependencies
        shell: pwsh
        working-directory: pst-extractor-v1.3/src
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements_fast.txt
          python -c "import pypff, pypdf, extract_msg, striprtf, win32com.client; print('dependencies OK')"

      - name: Build EXE
        shell: pwsh
        working-directory: pst-extractor-v1.3/src
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PSTThreadExtractor_v1.3 `
            --hidden-import pypff `
            --collect-all extract_msg `
            --collect-all striprtf `
            --hidden-import pypdf `
            --hidden-import charset_normalizer `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            pst_thread_extractor.py
          if (!(Test-Path 'dist/PSTThreadExtractor_v1.3.exe')) { throw 'EXE was not created' }

      - name: Packaged self-test
        shell: pwsh
        working-directory: pst-extractor-v1.3/src
        run: |
          Remove-Item '.\PSTThreadExtractor_selftest.txt' -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\dist\PSTThreadExtractor_v1.3.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed: $($p.ExitCode)" }
          if (!(Test-Path '.\PSTThreadExtractor_selftest.txt')) { throw 'self-test marker missing' }
          $marker = (Get-Content '.\PSTThreadExtractor_selftest.txt' -Raw).Trim()
          Write-Host "self-test marker: $marker"
          if ($marker -ne 'OK') { throw "self-test marker was not OK: $marker" }

      - name: Create checksums
        shell: pwsh
        working-directory: pst-extractor-v1.3/src
        run: |
          $h = (Get-FileHash '.\dist\PSTThreadExtractor_v1.3.exe' -Algorithm SHA256).Hash.ToLower()
          "$h  PSTThreadExtractor_v1.3.exe" | Set-Content -Encoding ascii '.\dist\SHA256.txt'
          Get-Item '.\dist\PSTThreadExtractor_v1.3.exe' | Format-List Name,Length
          Get-Content '.\dist\SHA256.txt'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSTThreadExtractor-v1.3-Windows-x64
          path: |
            pst-extractor-v1.3/src/dist/PSTThreadExtractor_v1.3.exe
            pst-extractor-v1.3/src/dist/SHA256.txt
            pst-extractor-v1.3/src/PSTThreadExtractor_selftest.txt
          if-no-files-found: error
          retention-days: 7
