name: LocalScribe Windows CPU reference gate
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'localscribe/**'
      - '.github/workflows/localscribe-windows-gate.yml'
permissions:
  contents: read
concurrency:
  group: localscribe-windows-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-cpu-reference:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'localscribe/windows-gate'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      LS_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact developer snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up developer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
          architecture: x64
      - name: Install vendor wheels using standard pip, not the app installer
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reference-evidence | Out-Null
          python -m pip install --report reference-evidence/pip-install.json --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple -r localscribe/ci/reference-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Vendor dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Vendor dependency consistency failed' }
          python -m pip freeze --all | Set-Content -Path reference-evidence/resolved-versions.txt -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { throw 'Resolved dependency inventory failed' }
      - name: Test reusable CPU engine, reconstruction and invalid-input rejection
        timeout-minutes: 23
        shell: pwsh
        run: |
          python localscribe/ci/reference_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Reference failed; application release remains blocked' }
      - name: Save developer evidence only, never audio or models
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localscribe-reference-evidence-${{ github.run_id }}
          path: reference-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish bounded gate summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'reference-evidence/SUMMARY.md') {
            Get-Content 'reference-evidence/SUMMARY.md' -Raw -Encoding UTF8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          } else {
            'Reference test did not reach execution. No release is approved.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }
