name: LocalScribe packaged Windows GUI gate
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'localscribe/**'
      - '.github/workflows/localscribe-windows-gate.yml'
permissions:
  contents: read
concurrency:
  group: localscribe-windows-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-packaged-gui:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'localscribe/windows-gate'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      LS_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact developer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up developer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
          architecture: x64
      - name: Build bundle, re-extract ZIP and exercise actual packaged GUI
        timeout-minutes: 30
        shell: pwsh
        run: |
          python localscribe/ci/package_build.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged GUI gate failed; no target-PC test authorized' }
      - name: Retain technical evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localscribe-package-evidence-${{ github.run_id }}
          path: package-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish bounded summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'package-evidence/SUMMARY.md') {
            Get-Content 'package-evidence/SUMMARY.md' -Raw -Encoding UTF8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          } else {
            'Package gate did not complete. No release approved.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          }
