name: PDRM Accepted Finish
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/accepted_finish.py'
      - 'PDRM_Local_Render_Engine_v1/pdrm_finish.cmd'
      - 'PDRM_Local_Render_Engine_v1/tests/test_accepted_finish.py'
      - 'PDRM_Local_Render_Engine_v1/docs/ACCEPTED_FINISH_GUIDE.md'
      - '.github/workflows/pdrm-accepted-finish-ci.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Check frozen DSP and production boundary
        shell: python
        run: |
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          import accepted_finish
          paths=subprocess.check_output(['git','diff','--name-only','a01a7cc265fd26d399316d35e6149bcda4f18a2a','HEAD'],text=True).splitlines()
          allowed={'PDRM_Local_Render_Engine_v1/accepted_finish.py','PDRM_Local_Render_Engine_v1/pdrm_finish.cmd','PDRM_Local_Render_Engine_v1/tests/test_accepted_finish.py','PDRM_Local_Render_Engine_v1/docs/ACCEPTED_FINISH_GUIDE.md','.github/workflows/pdrm-accepted-finish-ci.yml'}
          assert set(paths)<=allowed,paths
          print(accepted_finish.verify_dsp())
      - name: Test accepted DSP and the new entry
        shell: python
        run: |
          import sys,unittest,json,importlib.metadata
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          suite=unittest.TestSuite()
          for pattern in ('test_note_sub*.py','test_hf_temporal_contrast.py','test_accepted_finish.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          report={'tests_run':r.testsRun,'ok':r.wasSuccessful(),'failures':[(str(t),s) for t,s in r.failures],'errors':[(str(t),s) for t,s in r.errors],'skipped':[(str(t),s) for t,s in r.skipped],'platform':sys.platform,'python':sys.version,'scope':'machine checks; listening acceptance already decided by user','versions':{n:importlib.metadata.version(n) for n in ('numpy','scipy','soundfile','pyloudnorm','imageio-ffmpeg')}}
          Path('FINISH_TEST_RESULTS.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          sys.exit(0 if r.wasSuccessful() and r.testsRun==84 else 1)
      - name: Build isolated addon
        shell: python
        run: |
          import zipfile,hashlib
          from pathlib import Path
          with zipfile.ZipFile('PDRM_Accepted_Finish_v1.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('pdrm_finish.cmd','pdrm_finish.cmd')
              z.write('docs/ACCEPTED_FINISH_GUIDE.md','使い方.md')
              z.write('FINISH_TEST_RESULTS.json','PDRM_Finish_v1/FINISH_TEST_RESULTS.json')
              for name in ('accepted_finish.py','note_sub_lab.py','note_sub_lab_v02.py','hf_temporal_contrast_lab.py'):
                  z.write(name,'PDRM_Finish_v1/'+name)
              for p in Path('tests').glob('test_*.py'):
                  if p.name.startswith('test_note_sub') or p.name in ('test_hf_temporal_contrast.py','test_accepted_finish.py'):
                      z.write(p,'PDRM_Finish_v1/developer_tests/'+p.name)
          p=Path('PDRM_Accepted_Finish_v1.zip')
          Path('PDRM_Accepted_Finish_v1.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accepted-finish-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            PDRM_Local_Render_Engine_v1/PDRM_Accepted_Finish_v1.zip
            PDRM_Local_Render_Engine_v1/PDRM_Accepted_Finish_v1.sha256
            PDRM_Local_Render_Engine_v1/FINISH_TEST_RESULTS.json
          retention-days: 30
