name: PDRM Source-Driven Planning Step2 LAB
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/source_events_v41.py'
      - 'PDRM_Local_Render_Engine_v1/automatic_lowend_v41.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_automatic41.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_automatic41.py'
      - '.github/workflows/pdrm-automatic41-lab.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve checked DSP bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - name: Source-only extraction and calibration to saved WAV and decoded MP3
        run: python packaging/verify_automatic41.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-automatic41-${{ matrix.os }}
          path: PDRM_Local_Render_Engine_v1/AUTOMATIC41_EVIDENCE
          retention-days: 30
          if-no-files-found: error
  research-observer:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Official research checkpoint; no private music and no model redistribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 https://download.pytorch.org/torchaudio/models/hdemucs_high_musdbhq_only.pt -o "$RUNNER_TEMP/research.pt"
          echo "85ce4420e0852344b816487b4c4bb821bd406376b93bf684b2b76aa56404c46a  $RUNNER_TEMP/research.pt" | sha256sum -c
          python packaging/verify_automatic41.py --neural-checkpoint "$RUNNER_TEMP/research.pt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-automatic41-neural-research
          path: PDRM_Local_Render_Engine_v1/AUTOMATIC41_EVIDENCE
          retention-days: 30
          if-no-files-found: warn
      - name: Remove research weights from this job
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/research.pt"
