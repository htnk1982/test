name: PDRM Relative Event Decay LAB
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/event_decay_v39.py'
      - 'PDRM_Local_Render_Engine_v1/tests/decay39_fixtures.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_event_decay39.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_decay39.py'
      - '.github/workflows/pdrm-decay39-lab.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy soundfile pyloudnorm
      - name: Software contracts and clean versus known-fault waveform pairs
        run: python packaging/verify_decay39.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-decay39-${{ matrix.os }}
          path: PDRM_Local_Render_Engine_v1/DECAY39_EVIDENCE
          retention-days: 30
