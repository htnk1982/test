name: PDRM Distribution Target Regression
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/distribution_*.py'
      - '.github/workflows/pdrm-distribution-ci.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python packaging/verify_sources.py
