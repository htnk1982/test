name: PDRM Distribution v2
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/distribution_*.py'
      - 'PDRM_Local_Render_Engine_v1/pdrm_distribution_v2.cmd'
      - 'PDRM_Local_Render_Engine_v1/tests/test_distribution_finish.py'
      - 'PDRM_Local_Render_Engine_v1/docs/DISTRIBUTION_FINISH_GUIDE.md'
      - '.github/workflows/pdrm-distribution-ci.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen DSP and production unchanged
        shell: python
        run: |
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          import accepted_finish
          print(accepted_finish.verify_dsp())
          changed=subprocess.check_output(['git','diff','--name-only','a0bbc1e78fd723f3f54e513a4061515407a0c3da','HEAD'],text=True).splitlines()
          allowed={'PDRM_Local_Render_Engine_v1/distribution_finish.py','PDRM_Local_Render_Engine_v1/distribution_peak.py','PDRM_Local_Render_Engine_v1/distribution_launch.py','PDRM_Local_Render_Engine_v1/pdrm_distribution_v2.cmd','PDRM_Local_Render_Engine_v1/tests/test_distribution_finish.py','PDRM_Local_Render_Engine_v1/docs/DISTRIBUTION_FINISH_GUIDE.md','.github/workflows/pdrm-distribution-ci.yml'}
          assert set(changed)<=allowed,changed
      - name: Test 84 existing and 30 distribution regressions
        shell: python
        run: |
          import sys,unittest,json,platform,importlib.metadata
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          suite=unittest.TestSuite()
          for pattern in ('test_note_sub*.py','test_hf_temporal_contrast.py','test_accepted_finish.py','test_distribution_finish.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          report={'tests_run':r.testsRun,'ok':r.wasSuccessful(),'failures':[(str(t),s) for t,s in r.failures],'errors':[(str(t),s) for t,s in r.errors],'skipped':[(str(t),s) for t,s in r.skipped],'platform':platform.platform(),'python':sys.version,'scope':'Synthetic machine tests; real music is not uploaded to CI','versions':{n:importlib.metadata.version(n) for n in ('numpy','scipy','soundfile','pyloudnorm','imageio-ffmpeg')}}
          Path('DISTRIBUTION_TEST_RESULTS.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          sys.exit(0 if r.wasSuccessful() and r.testsRun==114 else 1)
      - name: Package versioned full chain
        shell: python
        run: |
          import zipfile,hashlib
          from pathlib import Path
          with zipfile.ZipFile('PDRM_Distribution_v2.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('pdrm_distribution_v2.cmd')
              z.write('docs/DISTRIBUTION_FINISH_GUIDE.md','使い方.md')
              for n in ('distribution_finish.py','distribution_peak.py','distribution_launch.py','accepted_finish.py','note_sub_lab.py','note_sub_lab_v02.py','hf_temporal_contrast_lab.py','DISTRIBUTION_TEST_RESULTS.json'):
                  z.write(n,'PDRM_Distribution_v2/'+n)
              for p in Path('tests').glob('test_*.py'):
                  if p.name.startswith('test_note_sub') or p.name in ('test_hf_temporal_contrast.py','test_accepted_finish.py','test_distribution_finish.py'):
                      z.write(p,'PDRM_Distribution_v2/developer_tests/'+p.name)
          p=Path('PDRM_Distribution_v2.zip')
          Path('PDRM_Distribution_v2.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-v2-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            PDRM_Local_Render_Engine_v1/PDRM_Distribution_v2.zip
            PDRM_Local_Render_Engine_v1/PDRM_Distribution_v2.sha256
            PDRM_Local_Render_Engine_v1/DISTRIBUTION_TEST_RESULTS.json
          retention-days: 30
