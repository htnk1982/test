name: PDRM Groove Low-End v3.5 LAB
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/groove_lowend_lab.py'
      - 'PDRM_Local_Render_Engine_v1/groove_conditioned_v35.py'
      - 'PDRM_Local_Render_Engine_v1/natural_finish_v35.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_groove_lowend_v35.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_groove_v35_sources.py'
      - 'PDRM_Local_Render_Engine_v1/docs/GROOVE35_LAB_IMPLEMENTATION_20260907.md'
      - '.github/workflows/pdrm-groove-v35-lab.yml'
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python packaging/verify_groove_v35_sources.py
