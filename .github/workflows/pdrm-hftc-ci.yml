name: PDRM HFTC Lab
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/hf_temporal_contrast*'
      - 'PDRM_Local_Render_Engine_v1/tests/test_hf_temporal_contrast.py'
      - 'PDRM_Local_Render_Engine_v1/docs/HFTC_LAB_GUIDE.md'
      - '.github/workflows/pdrm-hftc-ci.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove accepted implementations unchanged
        shell: python
        run: |
          import subprocess
          allowed={'PDRM_Local_Render_Engine_v1/hf_temporal_contrast_lab.py','PDRM_Local_Render_Engine_v1/hf_temporal_contrast.cmd','PDRM_Local_Render_Engine_v1/tests/test_hf_temporal_contrast.py','PDRM_Local_Render_Engine_v1/docs/HFTC_LAB_GUIDE.md','.github/workflows/pdrm-hftc-ci.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only','0201f2d9bacb87b3a1024f6ef1fa98f2018c78e2','HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          print('NOTE_SUB_AND_PRODUCTION_UNCHANGED', sorted(changed))
      - name: Run 43 Note-Sub and 24 HFTC synthetic tests
        shell: python
        run: |
          import os,sys,unittest,json,platform,importlib.metadata
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          loader=unittest.defaultTestLoader
          suite=unittest.TestSuite([loader.discover('tests',pattern='test_note_sub*.py'),loader.discover('tests',pattern='test_hf_temporal_contrast.py')])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          report={'tests_run':result.testsRun,'failures':[(str(t),s) for t,s in result.failures],'errors':[(str(t),s) for t,s in result.errors],'skipped':[(str(t),s) for t,s in result.skipped],'ok':result.wasSuccessful(),'commit':os.environ.get('GITHUB_SHA'),'platform':platform.platform(),'python':sys.version,'versions':{n:importlib.metadata.version(n) for n in ('numpy','scipy','soundfile','pyloudnorm','imageio-ffmpeg')},'scope':'Synthetic regressions only; no user audio uploaded or listening quality approval.'}
          Path('HFTC_TEST_RESULTS.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Package isolated experiment
        shell: python
        run: |
          import zipfile,hashlib
          from pathlib import Path
          files=['hf_temporal_contrast_lab.py','hf_temporal_contrast.cmd','note_sub_lab.py','docs/HFTC_LAB_GUIDE.md','HFTC_TEST_RESULTS.json']
          with zipfile.ZipFile('PDRM_HFTC_v01_AddOn.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:z.write(name,Path(name).name)
              z.write('tests/test_hf_temporal_contrast.py','developer_tests/test_hf_temporal_contrast.py')
          p=Path('PDRM_HFTC_v01_AddOn.zip')
          Path('PDRM_HFTC_v01_AddOn.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hftc-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            PDRM_Local_Render_Engine_v1/HFTC_TEST_RESULTS.json
            PDRM_Local_Render_Engine_v1/PDRM_HFTC_v01_AddOn.zip
            PDRM_Local_Render_Engine_v1/PDRM_HFTC_v01_AddOn.sha256
          retention-days: 30
