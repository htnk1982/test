name: PDRM Integrated Low-End Step1 LAB
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/integration_contract_v40.py'
      - 'PDRM_Local_Render_Engine_v1/lowend_coordinator_v40.py'
      - 'PDRM_Local_Render_Engine_v1/integrated_finish_v40.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_integration40.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_integrated_chain40.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_integration40.py'
      - '.github/workflows/pdrm-integration40-lab.yml'
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Keep source bytes LF for frozen DSP checks
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed integration-test dependencies, production requirements unchanged
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - name: Real DSP and codec integration with explicit synthetic planner
        run: python packaging/verify_integration40.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-integration40-${{ matrix.os }}
          path: PDRM_Local_Render_Engine_v1/INTEGRATION40_EVIDENCE
          if-no-files-found: error
          retention-days: 30
