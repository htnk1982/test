name: PDRM Joint42 Windows Frozen QA
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/packaging/build_joint42_qa.py'
      - 'PDRM_Local_Render_Engine_v1/joint42_selftest.py'
      - '.github/workflows/pdrm-joint42-frozen-qa.yml'
permissions:
  contents: read
jobs:
  frozen-qa:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed audio dependencies and recorded build tools
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0 pyinstaller==6.22.2
      - name: Actual joint DSP regression on this exact commit
        run: python packaging/verify_joint42.py
      - name: Build and run isolated QA EXE, not a public release
        run: python packaging/build_joint42_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-joint42-windows-frozen-evidence
          path: |
            PDRM_Local_Render_Engine_v1/JOINT42_EVIDENCE
            PDRM_Local_Render_Engine_v1/JOINT42_FROZEN_EVIDENCE
          if-no-files-found: error
          retention-days: 30
