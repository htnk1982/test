name: PDRM OPPO v3.1 Windows
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/offline_peak_rescue.py'
      - 'PDRM_Local_Render_Engine_v1/offline_peak_stream_v31.py'
      - 'PDRM_Local_Render_Engine_v1/natural_finish_v31.py'
      - 'PDRM_Local_Render_Engine_v1/natural_legacy_finish_v31.py'
      - 'PDRM_Local_Render_Engine_v1/natural_exe_entry_v31.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_offline_peak_rescue.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/build_oppo_windows_v31.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/smoke_oppo_windows_v31.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_oppo_v31_sources.py'
      - 'PDRM_Local_Render_Engine_v1/docs/OPPO_V31_GUIDE.md'
      - '.github/workflows/pdrm-oppo-v31-windows.yml'
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: codec-dist
          key: pdrm-codec-${{ runner.os }}-${{ hashFiles('PDRM_Local_Render_Engine_v1/packaging/build_codec.sh') }}
      - name: Build audio-only FFmpeg and matching sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64 make pkg-config xz-utils
          bash PDRM_Local_Render_Engine_v1/packaging/build_codec.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pdrm-native-codec-v31
          path: codec-dist
          retention-days: 30
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python packaging/verify_oppo_v31_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oppo-v31-source-tests
          path: PDRM_Local_Render_Engine_v1/SOURCE_TEST_RESULTS.json
  windows:
    needs: [codec, source]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pdrm-native-codec-v31
          path: codec-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated build dependencies
        run: |
          python -m venv .exeenv31
          .\.exeenv31\Scripts\python.exe -m pip install -r packaging/requirements-exe.txt
      - name: Verify frozen selected path and run all v3.1 regressions
        shell: python
        run: |
          import os,subprocess
          from pathlib import Path
          env=os.environ.copy();env['PATH']=str(Path('../codec-dist').resolve())+os.pathsep+env['PATH']
          subprocess.run([str(Path('.exeenv31/Scripts/python.exe').resolve()),'packaging/verify_oppo_v31_sources.py'],env=env,check=True)
      - name: Build OPPO v3.1 PyInstaller folder
        run: .\.exeenv31\Scripts\python.exe packaging/build_oppo_windows_v31.py --codec ../codec-dist
      - name: Test isolated EXE and source equivalence
        run: .\.exeenv31\Scripts\python.exe packaging/smoke_oppo_windows_v31.py
      - name: Package verified v3.1 EXE
        shell: python
        run: |
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path('dist/PDRM_OPPO')
          report=json.loads((root/'EXE_SMOKE_RESULTS.json').read_text(encoding='utf-8'))
          assert report['status']=='PASS'
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix() for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          name='PDRM_OPPO_EXE_Windows_x64_v3.1.0.zip'
          with zipfile.ZipFile(name,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in root.rglob('*'):
                  if p.is_file():z.write(p,'PDRM_OPPO/'+p.relative_to(root).as_posix())
          p=Path(name);Path(name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+name+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-oppo-v3.1-windows-x64
          path: |
            PDRM_Local_Render_Engine_v1/PDRM_OPPO_EXE_Windows_x64_v3.1.0.zip
            PDRM_Local_Render_Engine_v1/PDRM_OPPO_EXE_Windows_x64_v3.1.0.zip.sha256
            PDRM_Local_Render_Engine_v1/SOURCE_TEST_RESULTS.json
            PDRM_Local_Render_Engine_v1/dist/PDRM_OPPO/BUILD_REPORT.json
            PDRM_Local_Render_Engine_v1/dist/PDRM_OPPO/EXE_SMOKE_RESULTS.json
          retention-days: 30
