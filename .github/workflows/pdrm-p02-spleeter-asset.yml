name: PDRM Release Task P02 Spleeter Asset
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_spleeter_asset_v45.py'
      - '.github/workflows/pdrm-p02-spleeter-asset.yml'
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Spleeter official dependency set on Linux
        if: runner.os != 'Windows'
        run: python -m pip install spleeter==2.4.2 scipy==1.10.1 soundfile==0.12.1
      - name: Spleeter local-inference dependency set on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Spleeter 2.4.2 pins tensorflow-io-gcs-filesystem==0.32.0, for which
          # PyPI publishes no Windows wheel. Local model inference does not use
          # the GCS filesystem plugin. Install the declared runtime dependencies
          # explicitly, omit only that unavailable cloud-I/O plugin, then install
          # the exact Spleeter wheel without dependency re-resolution. The actual
          # official asset inference below is the acceptance condition.
          python -m pip install "tensorflow==2.12.1" "numpy==1.23.5" "scipy==1.10.1" "soundfile==0.12.1" "pandas==1.5.3" "norbert==0.2.1" "ffmpeg-python==0.2.0" "httpx[http2]==0.19.0" "typer==0.3.2"
          python -m pip install --no-deps spleeter==2.4.2
          python -m pip check | Tee-Object -FilePath P02_WINDOWS_PIP_CHECK.txt
      - name: Official asset checksum, extraction, analysis-only inference
        run: python packaging/verify_spleeter_asset_v45.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P02-spleeter-${{ matrix.os }}
          path: |
            PDRM_Local_Render_Engine_v1/P02_SPLEETER_EVIDENCE
            PDRM_Local_Render_Engine_v1/P02_WINDOWS_PIP_CHECK.txt
          if-no-files-found: warn
          retention-days: 30
