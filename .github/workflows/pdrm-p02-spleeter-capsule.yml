name: PDRM P02 Isolated Spleeter Runtime
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/observer_worker_spleeter_v47.py'
      - 'PDRM_Local_Render_Engine_v1/observer_runtime_client_v47.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/build_spleeter_capsule_v47.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_spleeter_capsule_v47.py'
      - '.github/workflows/pdrm-p02-spleeter-capsule.yml'
permissions:
  contents: read
jobs:
  capsule:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Builder Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build self-contained observer runtime
        run: python packaging/build_spleeter_capsule_v47.py
      - name: Main PDRM Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only main-process verification dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1
      - name: Launch isolated runtime from main process and remove runtime after evidence
        run: python packaging/verify_spleeter_capsule_v47.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P02-isolated-runtime-evidence
          path: PDRM_Local_Render_Engine_v1/P02_CAPSULE_EVIDENCE
          if-no-files-found: error
          retention-days: 30
