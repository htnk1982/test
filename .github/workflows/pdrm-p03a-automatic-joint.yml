name: PDRM P03-A Automatic Joint Planner
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v48.py'
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v49.py'
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v50.py'
      - 'PDRM_Local_Render_Engine_v1/relative_low_dominance_v49.py'
      - 'PDRM_Local_Render_Engine_v1/physical_add_bridge_v50.py'
      - 'PDRM_Local_Render_Engine_v1/same_f0_permission_v50.py'
      - 'PDRM_Local_Render_Engine_v1/spleeter_observer_adapter_v48.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_automatic_joint48.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_same_f0_fallback50.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_p03a_automatic_joint.py'
      - '.github/workflows/pdrm-p03a-automatic-joint.yml'
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed audio dependencies, no neural model or private audio
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - name: Existing regressions plus automatic joint planner
        run: python packaging/verify_p03a_automatic_joint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P03A-${{ matrix.os }}
          path: PDRM_Local_Render_Engine_v1/P03A_EVIDENCE
          if-no-files-found: error
          retention-days: 30
