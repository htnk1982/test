name: PDRM P03-A Real Observer Full Chain
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v48.py'
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v49.py'
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v50.py'
      - 'PDRM_Local_Render_Engine_v1/relative_low_dominance_v49.py'
      - 'PDRM_Local_Render_Engine_v1/physical_add_bridge_v50.py'
      - 'PDRM_Local_Render_Engine_v1/same_f0_permission_v50.py'
      - 'PDRM_Local_Render_Engine_v1/spleeter_observer_adapter_v48.py'
      - 'PDRM_Local_Render_Engine_v1/observer_worker_spleeter_v47.py'
      - 'PDRM_Local_Render_Engine_v1/observer_runtime_client_v47.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/build_spleeter_capsule_v47.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_p03a_runtime_joint.py'
      - '.github/workflows/pdrm-p03a-runtime-joint.yml'
permissions:
  contents: read
jobs:
  real-observer:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Builder Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated Spleeter runtime
        run: python packaging/build_spleeter_capsule_v47.py
      - name: Main PDRM Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install main-process audio dependencies only
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - name: Real isolated observer drives automatic joint-v46 through WAV and MP3
        run: python packaging/verify_p03a_runtime_joint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P03A-real-observer-evidence
          path: PDRM_Local_Render_Engine_v1/P03A_RUNTIME_EVIDENCE
          if-no-files-found: warn
          retention-days: 30
