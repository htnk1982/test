name: PDRM Release Task P06-A Frozen GUI
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/gui44_qa_entry.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/build_gui44_frozen_qa.py'
      - 'PDRM_Local_Render_Engine_v1/gui_runtime_v44.py'
      - 'PDRM_Local_Render_Engine_v1/gui_worker_entry_v44.py'
      - 'PDRM_Local_Render_Engine_v1/natural_gui_v44.py'
      - '.github/workflows/pdrm-p06a-frozen-gui.yml'
permissions:
  contents: read
jobs:
  frozen-gui:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0 pyinstaller==6.22.2
      - name: Build QA EXE and run Tk to separate-worker completion and cancel
        run: python packaging/build_gui44_frozen_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P06A-frozen-gui-evidence
          path: PDRM_Local_Render_Engine_v1/P06A_FROZEN_EVIDENCE
          if-no-files-found: error
          retention-days: 30
