name: PDRM Release Task P07-C Batch Resources
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/gui_runtime_v44.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_p07c_batch.py'
      - '.github/workflows/pdrm-p07c-batch.yml'
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - name: Mixed WAV FLAC multi-folder batch and work-root resource monitor
        run: python packaging/verify_p07c_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P07C-${{ matrix.os }}
          path: PDRM_Local_Render_Engine_v1/P07C_EVIDENCE
          if-no-files-found: error
          retention-days: 30
