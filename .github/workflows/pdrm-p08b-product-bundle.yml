name: PDRM P08-B Windows Product Bundle
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/product_app_v52.py'
      - 'PDRM_Local_Render_Engine_v1/product_worker_v52.py'
      - 'PDRM_Local_Render_Engine_v1/product_gui_runtime_v52.py'
      - 'PDRM_Local_Render_Engine_v1/product_processed_v52.py'
      - 'PDRM_Local_Render_Engine_v1/product_selftest_v52.py'
      - 'PDRM_Local_Render_Engine_v1/accepted_calibration_cache_v53.py'
      - 'PDRM_Local_Render_Engine_v1/precomputed_calibration_v54.json'
      - 'PDRM_Local_Render_Engine_v1/packaging/build_product_v52.py'
      - 'PDRM_Local_Render_Engine_v1/target_settings.py'
      - 'PDRM_Local_Render_Engine_v1/natural_gui_v34.py'
      - 'PDRM_Local_Render_Engine_v1/natural_gui_v44.py'
      - 'PDRM_Local_Render_Engine_v1/gui_runtime_v44.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_gui_runtime_v44.py'
      - 'PDRM_Local_Render_Engine_v1/auto_peak_v34.py'
      - 'PDRM_Local_Render_Engine_v1/offline_peak_stream_v32.py'
      - 'PDRM_Local_Render_Engine_v1/distribution_peak.py'
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v51.py'
      - 'PDRM_Local_Render_Engine_v1/spleeter_observer_adapter_v48.py'
      - 'PDRM_Local_Render_Engine_v1/observer_worker_spleeter_v47.py'
      - 'PDRM_Local_Render_Engine_v1/observer_runtime_client_v47.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/build_spleeter_capsule_v47.py'
      - '.github/workflows/pdrm-p08b-product-bundle.yml'
permissions:
  contents: read
jobs:
  windows-bundle:
    runs-on: windows-2022
    timeout-minutes: 70
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Builder Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated Spleeter runtime
        run: python packaging/build_spleeter_capsule_v47.py
      - name: Main PDRM Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen-main dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0 pyinstaller==6.16.0
      - name: Unit-test GUI status telemetry resilience
        run: python -m unittest tests.test_gui_runtime_v44 -v
      - name: Build and execute frozen product/precomputed-calibration self-test
        run: python packaging/build_product_v52.py
      - name: Assert distributable candidate before upload
        shell: pwsh
        run: |
          $bundle = 'P08_PRODUCT_BUNDLE/PDRM_Windows'
          $runtime = Join-Path $bundle 'PDRM_OBSERVER_RUNTIME'
          $probe = Join-Path $runtime 'models/4stems/.probe'
          if (!(Test-Path -LiteralPath (Join-Path $bundle 'PDRM.exe') -PathType Leaf)) { throw 'PDRM.exe missing' }
          if (!(Test-Path -LiteralPath (Join-Path $bundle 'precomputed_calibration_v54.json') -PathType Leaf)) { throw 'precomputed calibration metadata missing' }
          if (!(Test-Path -LiteralPath $probe -PathType Leaf)) { throw 'offline model .probe missing before upload' }
          if ((Get-Content -LiteralPath $probe -Raw).Trim() -ne 'PDRM_OFFLINE_OK') { throw 'offline model .probe content mismatch' }
          $sidecars = @(Get-ChildItem -LiteralPath (Join-Path $runtime 'models/4stems') -Recurse -File | Where-Object { $_.Name -like '._*' })
          if ($sidecars.Count -ne 0) { throw ('AppleDouble metadata leaked: ' + ($sidecars.FullName -join ', ')) }
          foreach ($name in @('vcruntime140.dll','msvcp140.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $runtime $name) -PathType Leaf)) { throw ('application-local VC runtime missing: ' + $name) }
          }
          $st = Get-Content -LiteralPath 'P08_PRODUCT_BUNDLE_EVIDENCE/SELFTEST/P08_PRODUCT_SELFTEST.json' -Raw | ConvertFrom-Json
          if (!$st.success -or !$st.frozen) { throw 'frozen product self-test failed' }
          if ($st.planner_id -ne 'automatic-joint-lab-0.4.0' -or $st.observer_provider -ne 'spleeter_runtime48') { throw 'frozen accepted identity changed' }
          if (!$st.source_unchanged -or $st.stem_audio_in_master) { throw 'frozen audio safety invariant failed' }
          if (!$st.precomputed_calibration_valid -or !$st.reference_free_product_request -or $st.reference_audio_bundled -or $st.reference_audio_required) { throw 'precomputed reference-free calibration path failed' }
          if ($st.precomputed_install_state -ne 'PRECOMPUTED_INSTALLED' -or $st.cache_second_request_state -ne 'HIT') { throw 'precomputed calibration cache install/reuse failed' }
          if (!$st.status_read_retry -or $st.status_read_retry_attempts -lt 4 -or $st.status_runtime_version -ne 'gui-runtime-v0.2.2') { throw 'status telemetry resilience contract failed' }
          if ($st.target_contract.lufs_step_db -ne 0.5 -or $st.target_contract.tp_step_db -ne 0.5 -or $st.target_contract.tp_max_dbtp -ne -0.5 -or !$st.target_contract.off_grid_lufs_rejected -or !$st.target_contract.off_grid_tp_rejected -or !$st.target_contract.tp_above_max_rejected) { throw 'target contract failed' }
          if ($st.targets.wav_lufs -ne -10 -or $st.targets.mp3_lufs -ne -14 -or $st.targets.wav_tp -ne -0.5 -or $st.targets.mp3_tp -ne -1) { throw 'default target propagation failed' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pdrm-P08-product-candidate
          path: PDRM_Local_Render_Engine_v1/P08_PRODUCT_BUNDLE/PDRM_Windows
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P08-product-build-evidence
          path: PDRM_Local_Render_Engine_v1/P08_PRODUCT_BUNDLE_EVIDENCE
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

  # Diagnostic only. The single actual user PC is the final distribution gate.
  artifact-roundtrip:
    needs: windows-bundle
    continue-on-error: true
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdrm-P08-product-candidate
          path: 'roundtrip_日本語 空白_P08'
      - name: Verify delivered native runtime
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'roundtrip_日本語 空白_P08'
          $runtime = Join-Path $root 'PDRM_OBSERVER_RUNTIME'
          $probe = Join-Path $runtime 'models/4stems/.probe'
          if (!(Test-Path -LiteralPath (Join-Path $root 'precomputed_calibration_v54.json') -PathType Leaf)) { throw 'artifact lost precomputed calibration metadata' }
          if (!(Test-Path -LiteralPath $probe -PathType Leaf)) { throw 'artifact roundtrip lost .probe' }
          $sidecars = @(Get-ChildItem -LiteralPath (Join-Path $runtime 'models/4stems') -Recurse -File | Where-Object { $_.Name -like '._*' })
          if ($sidecars.Count -ne 0) { throw 'artifact contains AppleDouble metadata' }
          & (Join-Path $runtime 'python.exe') -I (Join-Path $runtime 'observer_worker_spleeter_v47.py') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'artifact native worker self-test failed' }
      - name: Execute frozen full product self-test after artifact roundtrip
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'roundtrip_日本語 空白_P08'
          $out = Join-Path $PWD 'roundtrip_P08_evidence'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & (Join-Path $root 'PDRM.exe') --self-test --self-test-output $out
          if ($LASTEXITCODE -ne 0) { throw 'artifact frozen product self-test failed' }
          $st = Get-Content -LiteralPath (Join-Path $out 'P08_PRODUCT_SELFTEST.json') -Raw | ConvertFrom-Json
          if (!$st.success -or !$st.frozen) { throw 'roundtrip product self-test success=false' }
          if ($st.planner_id -ne 'automatic-joint-lab-0.4.0' -or $st.observer_provider -ne 'spleeter_runtime48') { throw 'roundtrip product identity failed' }
          if (!$st.source_unchanged -or $st.stem_audio_in_master) { throw 'roundtrip product safety failed' }
          if (!$st.precomputed_calibration_valid -or !$st.reference_free_product_request -or $st.cache_second_request_state -ne 'HIT') { throw 'roundtrip precomputed calibration failed' }
          if (!$st.status_read_retry -or $st.status_runtime_version -ne 'gui-runtime-v0.2.2') { throw 'roundtrip status telemetry resilience failed' }
          if ($st.target_contract.lufs_step_db -ne 0.5 -or $st.target_contract.tp_step_db -ne 0.5 -or $st.target_contract.tp_max_dbtp -ne -0.5) { throw 'roundtrip target contract failed' }
          if ($st.targets.wav_lufs -ne -10 -or $st.targets.mp3_lufs -ne -14 -or $st.targets.wav_tp -ne -0.5 -or $st.targets.mp3_tp -ne -1) { throw 'roundtrip default target propagation failed' }
          $st | ConvertTo-Json -Depth 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-P08-product-artifact-roundtrip-evidence
          path: roundtrip_P08_evidence
          if-no-files-found: warn
          retention-days: 30
