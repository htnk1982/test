name: PDRM Source and Targets Compatibility
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/processed_finish.py'
      - 'PDRM_Local_Render_Engine_v1/target_*.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_target_controls.py'
      - '.github/workflows/pdrm-processed-ci.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python packaging/verify_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-targets-${{ matrix.os }}-py${{ matrix.python }}
          path: PDRM_Local_Render_Engine_v1/SOURCE_TEST_RESULTS.json
