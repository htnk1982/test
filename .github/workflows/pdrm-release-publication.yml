name: PDRM Release Task P07-A Publication
on:
  push:
    branches: [pdrm-note-sub-lab-v1]
    paths:
      - 'PDRM_Local_Render_Engine_v1/processed_integration.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_processed_integration.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_release_publication.py'
      - '.github/workflows/pdrm-release-publication.yml'
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve checked source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed audio dependencies, no model or user music
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0 psutil==7.0.0
      - name: Existing regression and P07-A end-to-end acceptance
        run: python packaging/verify_release_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-release-P07A-${{ matrix.os }}
          path: PDRM_Local_Render_Engine_v1/RELEASE_EXECUTION_EVIDENCE
          retention-days: 30
          if-no-files-found: error
