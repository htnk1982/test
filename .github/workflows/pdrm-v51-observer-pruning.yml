name: PDRM v51 Observer Pruning
on:
  push:
    branches: [pdrm-observer-pruning-v51]
    paths:
      - 'PDRM_Local_Render_Engine_v1/automatic_joint_v51.py'
      - 'PDRM_Local_Render_Engine_v1/tests/test_automatic_joint51.py'
      - 'PDRM_Local_Render_Engine_v1/packaging/verify_p03a_v51_pruning.py'
      - 'PDRM_Local_Render_Engine_v1/observer_worker_spleeter_v47.py'
      - 'PDRM_Local_Render_Engine_v1/observer_runtime_client_v47.py'
      - 'PDRM_Local_Render_Engine_v1/spleeter_observer_adapter_v48.py'
      - '.github/workflows/pdrm-v51-observer-pruning.yml'
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install planner test dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0
      - name: Run v51 and v50 source-gate contracts
        run: python -m unittest -v tests.test_automatic_joint51 tests.test_same_f0_fallback50

  real-spleeter-parity:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: PDRM_Local_Render_Engine_v1
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Builder Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated Spleeter runtime
        run: python packaging/build_spleeter_capsule_v47.py
      - name: Main PDRM Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install main-process verification dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 pyloudnorm==0.2.0 imageio-ffmpeg==0.6.0
      - name: Compare accepted v50 with pruned v51 using real Spleeter
        run: python packaging/verify_p03a_v51_pruning.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdrm-v51-observer-pruning-evidence
          path: PDRM_Local_Render_Engine_v1/P51_PRUNING_EVIDENCE
          if-no-files-found: warn
          retention-days: 30
