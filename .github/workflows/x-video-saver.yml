name: Build X Video Saver APK

on:
  push:
    branches:
      - x-video-saver-build
    paths:
      - 'XVideoSaver/**'
      - '.github/workflows/x-video-saver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Smoke test resolver against supplied X post
        working-directory: XVideoSaver
        run: python3 smoke_test.py 2096554012937973979

      - name: Build debug APK
        working-directory: XVideoSaver
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify Android APK signature
        working-directory: XVideoSaver
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee APK_VERIFY.txt

      - name: Prepare artifact
        working-directory: XVideoSaver
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XVideoSaver-v0.1.0.apk
          sha256sum XVideoSaver-v0.1.0.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XVideoSaver-APK
          path: |
            XVideoSaver/XVideoSaver-v0.1.0.apk
            XVideoSaver/SHA256SUMS.txt
            XVideoSaver/APK_VERIFY.txt
          if-no-files-found: error
          retention-days: 30
