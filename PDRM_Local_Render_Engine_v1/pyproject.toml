[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrm-local-render-engine"
version = "1.0.0.dev0"
description = "PDRM Local Render Engine v1 - conservative offline 2mix finalizer core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
]

[project.scripts]
pdrm-render = "pdrm_engine.cli:main"

[tool.setuptools]
packages = ["pdrm_engine"]
